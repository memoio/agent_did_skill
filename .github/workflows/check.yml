name: Skill package checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: skills/memo-agent-did-opbnb-testnet/package-lock.json
      - name: Install opBNB Skill dependencies without lifecycle hooks
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: skills/memo-agent-did-opbnb-testnet
      - name: Build, test, verify and install isolated copies
        run: npm run check
      - name: Verify Skills discovery and isolated installation
        env:
          DISABLE_TELEMETRY: '1'
        run: |
          npx --yes skills@1.7.6 add . --list
          probe="$(mktemp -d)"
          cd "$probe"
          npx --yes skills@1.7.6 add "$GITHUB_WORKSPACE" --skill memo-agent-did-opbnb-testnet -a codex -y --copy
          cd "$probe/.agents/skills/memo-agent-did-opbnb-testnet"
          node scripts/setup-runtime.mjs --json
          test -d node_modules/ethers
